services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apta
      POSTGRES_PASSWORD: apta
      POSTGRES_DB: apta_db
    ports:
      - "5432:5432"
    volumes:
      - apta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apta -d apta_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  apta_postgres_data:
